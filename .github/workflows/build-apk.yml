name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check shift patterns and Jalali dates
        run: |
          curl --fail --location --retry 3 https://github.com/JetBrains/kotlin/releases/download/v2.0.0/kotlin-compiler-2.0.0.zip -o "$RUNNER_TEMP/kotlin.zip"
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP/kotlin"
          bash "$RUNNER_TEMP/kotlin/kotlinc/bin/kotlinc" app/src/main/java/ir/samansaz/shiftcalendar/JalaliDate.kt app/src/main/java/ir/samansaz/shiftcalendar/ShiftPlan.kt tests/ShiftPlanCheck.kt -include-runtime -d "$RUNNER_TEMP/check.jar"
          java -jar "$RUNNER_TEMP/check.jar"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saman-shift-calendar-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
